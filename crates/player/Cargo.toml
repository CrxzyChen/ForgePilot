[package]
name = "ai-game-player"
description = "Generic native player for exported AI Game Studio projects"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ai-game-script-host = { path = "../script-host" }
bytemuck = { version = "1.24.0", features = ["derive"] }
glam = { version = "=0.33.6", features = ["bytemuck"] }
image = { version = "=0.25.8", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
] }
pollster = "0.4.0"
resvg = { version = "=0.45.1", default-features = false }
rodio = { version = "=0.21.1", default-features = false, features = [
  "playback",
  "mp3",
  "wav",
  "vorbis",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "=0.5.5", default-features = false, features = [
  "mp3",
  "pcm",
  "wav",
  "ogg",
  "vorbis",
] }
wgpu = "30.0.1"
winit = "0.30.13"

[lints]
workspace = true
